# The open items of the plan.  Schema: schemas/todo.schema.json; check: harness/check_todo.py (run by the hook).
#
# Each item carries its context as statements, every one pinned — by a test in harness/test_claims.py, an action or a
# static check of harness/run.py (check_todo pins what the item's own acceptance test shows while it fails) — or marked
# a hypothesis; the stubs (stubs.py) its acceptance test is written against; and the acceptance test itself, a function
# of harness/test_acceptance.py that must fail while the item is open and pass when it is done.  Numbers are not written
# here: they live in harness/baseline.json and the README.
$schema: schemas/todo.schema.json
items:

# ---------------------------------------------------------------------------------------------------- round 3
- id: torch-pinned
  title: The cell runs under PyTorch, pinned by a `torch` action in the hook
  status: done
  round: 3
  context:
  - text: The compiled cell is five sparse ReLU layers and a readout of zeros and ones whose weights are plus or minus one, except a large negative weight on a literal the cell cannot see, with integer thresholds, so single precision is exact.
    pinned_by: test_cell_weights_are_named_integers
  - text: "`cell_torch.py` builds the same matrices as torch sparse CSR buffers, and the `torch` action (`harness/eval_torch.py`) steps the scipy and torch runners side by side on every dev and test sentence and counts the sentences whose states ever differ, an item of the lattice (torch.exact) whose top is zero."
    pinned_by: torch
  - text: torch comes from the PyTorch CPU index, declared as an explicit index in pyproject.toml and locked by sha256 like every other dependency, in a dependency group the hook's sync installs by default.
    pinned_by: test_dependencies_hash_pinned
  acceptance: test_torch_action_in_hook
  touches: [pyproject.toml, uv.lock, harness/run.py, harness/lattice.py, harness/baseline.json, docs/README.tmpl.md]

- id: print-rules
  title: Printing rules in normal form for single-clause frames, checked against generate()
  status: done
  round: 3
  context:
  - text: The semantic layer generates the Japanese from the frame, and the frame never looks at the English again.
    pinned_by: test_layers_roundtrip
  - text: "`gen_module.py` holds the printing rules in the normal form of np_module — per position, an ordered decision over slot predicates (base literals and derived DNFs, every one a test on the flat frame) whose terminals emit one token: a constant morpheme, a slot's value, or a form of the verb or the copula's adjective from the morphology table."
    pinned_by: test_print_rules_normal_form
  - text: The `printer` action steps the rules on every sentence the rule parser parses and on a sweep of frames over the predicates they test; the rules agree with generate() wherever they print and refuse the frames that hold a register the cell has no block for, as the lattice items printer and printer.sweep record.
    pinned_by: printer
  - text: generate() still contains string surgery that slices the inner predicate off a printed string for inner clauses, infinitives and control, which the rules do not cover and the frame cannot hold.
    hypothesis: true
  acceptance: test_print_rules_match_generate
  touches: [gen_module.py, harness/eval_printer.py, harness/test_claims.py, harness/lattice.py]

- id: decoder-compile
  title: "Compile the printing rules into the cell: emit, read gates, form gates, y(t)"
  status: done
  round: 3
  depends_on: [print-rules]
  context:
  - text: The state is six kinds of one-hot block — control, slots, the pending preposition, the shift and emit units, and the output morpheme — and the printing positions are control states of the one control block, entered from DONE.
    pinned_by: test_matrix_cell_shape
  - text: A slot write is a gated copy — a block gate and a source gate in one layer, write and keep units in the next, the readout summing them into the block — and a slot read is the same circuit with the arrows reversed, a read gate ORed from the printing rules and one read unit per value summed into the output; a read with nothing in the block fires into FAIL as a copy with no source does.
    pinned_by: test_decoder_mirrors_encoder
  - text: The cell's own print head, not generate() on the frame, is what the matrix action compares with the rule transducer, and the torch action steps both runners through the printing too.
    pinned_by: test_decoder_is_the_cell_run_backwards
  acceptance: test_decoder_emits_japanese
  touches: [parser_matrix.py, cell_torch.py, parser.py, harness/eval_matrix.py, harness/render_neurons.py, docs/cell.puml]

- id: hand-modules
  title: Translate the PP machine, predicate and copula_predicate by hand into modules with complete guards
  status: done
  round: 3
  context:
  - text: np_module, translated by hand from parse_np, agrees with it on every window of at most two tokens over the token classes, of-phrases included.
    pinned_by: np
  - text: "The PP machine, predicate and copula_predicate are hand-translated modules with complete guards (`pp_module.py`, `predicate_module.py`): per position an ordered decision whose last rule is the refusal, spliced into the cell at every activation of those methods in place of the rules extracted for them; what is still extracted is the start of the sentence, the question paths, the verb phrase, its objects and the end."
    pinned_by: test_clause_modules_replace_extraction
  - text: The cell misfires on no sentence of the corpus, and refuses the sentences the rules parse that its scope does not hold.
    pinned_by: matrix
  - text: The gaps that remain are inner clauses, folded frames and the paths still extracted; translating pre, the question paths, verb_phrase and tail by hand would leave the cell no induced guard.
    hypothesis: true
  acceptance: test_hand_modules_agree
  touches: [pp_module.py, predicate_module.py, parser_matrix.py, np_module.py, parser_rules.py, gen_module.py]

- id: inner-clauses
  title: Inner clauses in one frame — printing at clause end, clearing, the outer predicate in tag slots
  status: open
  round: 3
  depends_on: [decoder-compile, hand-modules]
  context:
  - text: The rule parser is a bounded transducer with a frame stack of depth at most two, and the matrix state has no second bank of slots for an inner clause.
    pinned_by: test_rule_parser_bounds
  - text: Sentences whose frame uses an inner-clause register are out of the matrix's scope and are refused by it.
    pinned_by: matrix
  - text: Inner clauses need no second bank — when a clause closes its printing positions run at once, its slots are cleared by the gates that write them, the outer predicate waits in a few tag slots, and a clause that writes a slot the open frame already holds is refused.
    hypothesis: true
  stubs: [ClauseFlush]
  acceptance: test_inner_clause_sentence_agrees
  touches: [parser_matrix.py, parser_rules.py, np_module.py]

- id: lexical-layer0
  title: "The lexical layer as layer 0: verb-conditioned readings inside the cell"
  status: open
  round: 3
  context:
  - text: Two feedback edges cross the layers — the noun's use-verb rewrites the verb, and the parser's state decides which reading of a token is used.
    pinned_by: test_feedback_edges
  - text: The second edge is computed outside the matrices today, by table_hits reading the verb from the state before each step.
    hypothesis: true
  stubs: [Layer0Lexical]
  acceptance: test_lexical_hits_inside_cell
  touches: [parser_matrix.py, cell_torch.py]

- id: normal-form
  title: Reduced ordered decision diagrams as the canonical form of the rules
  status: open
  round: 3
  context:
  - text: A compiled rule is a control point, a conjunction of literals and a target with the tokens consumed and the slot writes; the cell holds rules of the module kind and rules extracted from traces.
    pinned_by: test_matrix_cell_shape
  - text: Per control point, a reduced ordered decision diagram over a fixed literal order is canonical — the same machine always yields the same diagram, every path ends in a terminal or a refusal, and "module equals induced" becomes diagram equality.
    hypothesis: true
  stubs: [Canon]
  acceptance: test_canonical_diagrams
  touches: [canon.py, parser_matrix.py, np_module.py]

# ---------------------------------------------------------------------------------------------------- carried over
- id: matrix-chain-scope
  title: Matrix items only for sentences the rules parse
  status: open
  round: 2
  context:
  - text: The matrix parser on a sentence is MISFIRE, GAP or AGREE against the rule parser.
    pinned_by: test_lattice_order
  - text: Both parsers refusing a sentence counts as AGREE today, so a rule-parser gain the matrix cannot represent reads as a down move on the matrix item.
    pinned_by: check_todo
  acceptance: test_matrix_items_scope
  touches: [harness/lattice.py, harness/baseline.json, CLAUDE.md]

