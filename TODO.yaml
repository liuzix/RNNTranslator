- id: bare-time-phrases
  title: A time phrase with no preposition — last month, tomorrow afternoon, every night — read as when
  status: open
  round: 7
  context:
    - text: The rule parser refuses a noun phrase of time after the object that no preposition introduces (tomorrow afternoon, next
        winter), and where the verb has no object yet it reads one as the object (he came last month → 最後の月を来た).
      pinned_by: check_todo
    - text: The time register already holds the single words (yesterday) and the merged ones (last night); last, next, this, every
        and all before a noun of time are a closed pattern of the lexical layer that yields the same reading — 先月, 来年の冬,
        明日の午後, 毎晩, 一日中 — and the parser gains no rule.
      hypothesis: true
  acceptance: test_bare_time_phrases_right
  touches: [rules_ja.py, tables/lexicon.tbl, tables/duration.tbl, parser_rules.py]

