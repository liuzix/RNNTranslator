  title: Complement patterns (suite G)
  status: open
  round: 2
  context:
  - text: The hearsay suffix ("i hear ...") over a perfect predicate is refused.
    pinned_by: suites
  acceptance: test_suite_g_closed
- id: suite-h
  title: Discourse, ellipsis, coordination (suite H)
  status: open
  round: 2
  context:
  - text: The coordinate clause with ellipsis ("does not either") is an inner clause and is refused.
    pinned_by: suites
  acceptance: test_suite_h_closed
- id: suite-l
  title: Sense and reading selection (suite L)
  status: open
  round: 2
  context:
  - text: The purpose clause after a motion verb ("has gone to study medicine") is read as a noun phrase, and one more reading is still chosen wrongly.
    pinned_by: suites
  acceptance: test_suite_l_closed
- id: suite-m
  title: Register and dropped words (suite M)
  status: open
  round: 2
  context:
  - text: A past-leaning adverb does not yet decide the tense of an ambiguous verb form.
    pinned_by: suites
  acceptance: test_suite_m_closed
