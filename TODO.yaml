# The open items of the plan.  Schema: schemas/todo.schema.json; check: harness/check_todo.py (run by the hook).
#
# Each item carries its context as statements, every one pinned — by a test in harness/test_claims.py, an action or a
# static check of harness/run.py (check_todo pins what the item's own acceptance test shows while it fails) — or marked
# a hypothesis; the stubs (stubs.py) its acceptance test is written against; and the acceptance test itself, a function
# of harness/test_acceptance.py that must fail while the item is open and pass when it is done.  Numbers are not written
# here: they live in harness/baseline.json and the README.
$schema: schemas/todo.schema.json
items:

# ---------------------------------------------------------------------------------------------------- round 4
# Inner clauses that generate() folds into a string: each is read in the one frame the way a that-clause is — the outer prefix
# printed at the boundary, the outer predicate held in the tag slots, the clause printed when it closes in a mode of its own,
# the slots cleared and the tags restored — and the constructions that slice a generated string print the stem form directly.
- id: clause-modes
  title: Print modes that end an inner clause at a stem form, so that no construction slices a generated string
  status: open
  round: 4
  context:
    - text: A that-clause is read in the one frame — the outer prefix printed at the boundary, the outer predicate held in the tag
        slots, the clause printed in mode embedded when it closes (が on its subject, plain forms, と), the tags restored for the suffix.
      pinned_by: test_inner_clause_in_one_frame
    - text: The printing rules end a clause at a finite form of its predicate, in every mode they have — the sentence, the prefix
        before a that-clause, the clause itself and the suffix after it.
      pinned_by: printer
    - text: generate() builds the Japanese of a purpose clause, a manner clause, a control clause and an adjective's infinitive by
        slicing the string of the inner clause and appending a stem form of its predicate — the masu stem with に or ながら, the te
        form, the causative conjugated with the outer tense — which no slot read gives.
      hypothesis: true
    - text: An inner clause needs print modes that end at the stem form its construction asks for — te, the masu stem, the plain form,
        the causative taking the outer predicate's tense from the tags — so that every construction prints by slot reads, constant
        morphemes and form lookups, the stem forms being columns of the morphology table the form gates already read.
      hypothesis: true
  stubs: [ClauseModes]
  acceptance: test_clause_modes_end_at_stem_forms
  touches: [gen_module.py, parser_matrix.py]

- id: coordination
  title: Coordinated clauses — the first clause flushed at the conjunction in the link's mode
  status: open
  round: 4
  depends_on: [clause-modes]
  context:
    - text: A coordinated sentence folds the clause before the conjunction into a string — its te form for and, が for but, ので for
        so — that the frame carries as pre_clause, a register the cell has no block for, so the cell refuses every coordinated
        sentence the rules translate.
      pinned_by: matrix
    - text: The first clause ends at the conjunction, where the English order is the Japanese order, so the flush that prints a
        that-clause prints it — in the mode ending at the te form for and, at the finite form with が or ので for but and so — its
        slots cleared for the second clause, whose dropped subject is the first's.
      hypothesis: true
  stubs: [Coordination]
  acceptance: test_coordinated_clauses_agree
  touches: [parser_matrix.py, gen_module.py, parser_rules.py]

- id: subordinate-clauses
  title: Subordinate clauses — when, if, because, although — flushed at the comma with their conjunction
  status: open
  round: 4
  depends_on: [clause-modes]
  context:
    - text: A subordinate clause is folded into pre_clause as a string ending in its conjunction's Japanese — とき, なら, ので, が —
        and the cell refuses every sentence the rules translate that has one.
      pinned_by: matrix
    - text: generate() prints the subordinate clause before the main clause whatever its English position, so a clause that comes
        first is a flush at the comma in a mode ending with its conjunction, nothing of the main clause read yet; a clause that
        follows its main clause needs the main clause held whole while the subordinate one is read and printed first — a second
        bank of slots, or an output register the clause is printed into ahead of the main clause's output — which the one-frame
        design does not have.
      hypothesis: true
  stubs: [SubordinateClause]
  acceptance: test_subordinate_clause_first_agrees
  touches: [parser_matrix.py, gen_module.py, parser_rules.py]

- id: relative-clauses
  title: Relative clauses — the modified noun phrase held while the clause is read and printed before it
  status: open
  round: 4
  depends_on: [clause-modes]
  context:
    - text: A relative clause is folded into the noun phrase it modifies as a string, the frame is marked folded, and the cell
        refuses it.
      pinned_by: test_np_of_phrase
    - text: Japanese puts the clause before its head noun (医者である息子), so at the relative pronoun the outer prefix up to the
        modified noun phrase is printed, the noun phrase's slots are held beside the tags, the clause is read and printed in a mode
        ending at the plain form, and the held noun phrase follows with its particle; a clause that writes a slot the hold already
        has is refused.
      hypothesis: true
  stubs: [RelativeClause]
  acceptance: test_relative_clause_agrees
  touches: [parser_matrix.py, gen_module.py, np_module.py]

- id: infinitives
  title: Infinitive complements of a copula — te before the adjective, のは and のには before it
  status: open
  round: 4
  depends_on: [clause-modes]
  context:
    - text: The infinitive register holds an inner clause printed around the copula's adjective — the te form before it (difficult
        to solve → 解いて難しい), the clause with のは before an extraposed one (it is definite that S), a noun-phrase infinitive with
        のには — and the cell refuses it.
      pinned_by: matrix
    - text: Each is a flush in its own mode at the boundary — te, のは, のには — with the copula held in the tags, the dummy subject
        それ of an extraposed clause dropped as the weather rule drops it.
      hypothesis: true
  stubs: [Infinitive]
  acceptance: test_infinitive_clauses_agree
  touches: [parser_matrix.py, gen_module.py, predicate_module.py]

- id: purpose-clauses
  title: Purpose clauses — the masu stem with に, or the plain form with ために, before the main verb
  status: open
  round: 4
  depends_on: [clause-modes]
  context:
    - text: A purpose infinitive after a verb (come to talk, go to see) is folded as purpose_clause and printed before the main verb
        as the masu stem with に, or the plain form with ために; the cell refuses it.
      pinned_by: matrix
    - text: The main verb is already in the verb slot when the purpose clause opens, so the tags hold it as they hold a reporting
        verb, and the clause prints in a mode ending at the masu stem with に, or at the plain form with ために.
      hypothesis: true
  stubs: [PurposeClause]
  acceptance: test_purpose_clauses_agree
  touches: [parser_matrix.py, gen_module.py, pp_module.py]

- id: gerunds
  title: Gerund and manner clauses — the plain form with のを or こと, the masu stem with ながら
  status: open
  round: 4
  depends_on: [clause-modes]
  context:
    - text: A gerund clause — the object of a preposition or a verb (thinking of going, insisted on going) — or a manner clause
        (stood looking) is folded into the frame as a string, and the cell refuses it.
      pinned_by: matrix
    - text: The verb before the gerund is already in the verb slot, so the tags hold it, and the clause prints in a mode ending at the
        plain form with のを or こと, or at the masu stem with ながら.
      hypothesis: true
  stubs: [Gerund]
  acceptance: test_gerund_clauses_agree
  touches: [parser_matrix.py, gen_module.py, pp_module.py]

- id: control-clauses
  title: Object-control clauses — the object as the inner subject, ように or the causative with the outer tense
  status: open
  round: 4
  depends_on: [clause-modes]
  context:
    - text: An object-control clause (asked him to open the window, made him change his plan) is folded as control — its subject
        takes に, its predicate the plain form with ように, or the causative conjugated with the outer clause's tense — and the cell
        refuses it.
      pinned_by: matrix
    - text: The object becomes the inner subject by a move, not a copy, the outer verb waits in the tags, and the clause prints in a
        mode ending at the plain form with ように, or at the causative form whose finite suffix reads the tags' tense.
      hypothesis: true
  stubs: [ControlClause]
  acceptance: test_control_clauses_agree
  touches: [parser_matrix.py, gen_module.py, predicate_module.py]

# ---------------------------------------------------------------------------------------------------- round 2, carried over
- id: matrix-chain-scope
  title: Matrix items only for sentences the rules parse
  status: open
  round: 2
  context:
  - text: The matrix parser on a sentence is MISFIRE, GAP or AGREE against the rule parser.
    pinned_by: test_lattice_order
  - text: Both parsers refusing a sentence counts as AGREE today, so a rule-parser gain the matrix cannot represent reads as a down move on the matrix item.
    pinned_by: check_todo
  acceptance: test_matrix_items_scope
  touches: [harness/lattice.py, harness/baseline.json, CLAUDE.md]

- id: passives
  title: Passives and absolute clauses (suite I)
  status: deferred
  round: 2
  context:
  - text: Passives are refused by design — the frame has no passive register — and the absolute clause is an inner clause.
    pinned_by: suites
  acceptance: test_suite_i_closed
  touches: [parser_rules.py, rules_ja.py, tables/verb_classes.tbl]

- id: suite-d
  title: Gerunds (suite D)
  status: open
  round: 2
  context:
  - text: A V-ing clause as a noun phrase is parsed only in some of its positions.
    pinned_by: suites
  acceptance: test_suite_d_closed
- id: suite-e
  title: Degree and superlative (suite E)
  status: open
  round: 2
  context:
  - text: The comparative inside a there-is sentence ("there are more girls than boys") is mistranslated.
    pinned_by: suites
  acceptance: test_suite_e_closed
- id: suite-g
  title: Complement patterns (suite G)
  status: open
  round: 2
  context:
  - text: The hearsay suffix ("i hear ...") over a perfect predicate is refused.
    pinned_by: suites
  acceptance: test_suite_g_closed
- id: suite-h
  title: Discourse, ellipsis, coordination (suite H)
  status: open
  round: 2
  context:
  - text: The coordinate clause with ellipsis ("does not either") is an inner clause and is refused.
    pinned_by: suites
  acceptance: test_suite_h_closed
- id: suite-l
  title: Sense and reading selection (suite L)
  status: open
  round: 2
  context:
  - text: The purpose clause after a motion verb ("has gone to study medicine") is read as a noun phrase, and one more reading is still chosen wrongly.
    pinned_by: suites
  acceptance: test_suite_l_closed
- id: suite-m
  title: Register and dropped words (suite M)
  status: open
  round: 2
  context:
  - text: A past-leaning adverb does not yet decide the tense of an ambiguous verb form.
    pinned_by: suites
  acceptance: test_suite_m_closed
