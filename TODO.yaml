# The open items of the plan.  Schema: schemas/todo.schema.json; check: harness/check_todo.py (run by the hook).
#
# Each item carries its context as statements, every one pinned — by a test in harness/test_claims.py, an action or a
# static check of harness/run.py (check_todo pins what the item's own acceptance test shows while it fails) — or marked
# a hypothesis; the stubs (stubs.py) its acceptance test is written against; and the acceptance test itself, a function
# of harness/test_acceptance.py that must fail while the item is open and pass when it is done.  Numbers are not written
# here: they live in harness/baseline.json and the README.
$schema: schemas/todo.schema.json
items:

# ---------------------------------------------------------------------------------------------------- round 4
# Inner clauses that generate() folds into a string: each becomes a frame of its own in the context, as a that-clause is.  The
# encoder flushes the frame of the clause it leaves, with a link of the inner clause's kind, and reads the inner clause into the
# cleared frame; the decoder's attention moves down at the link, the clause prints in the form its kind asks for, and the
# attention moves back.  Nothing is printed before the encoder is done, so the order of the frames is the decoder's to choose.
- id: clause-modes
  title: Clause kinds that end at a stem form, so that no construction slices a generated string
  status: done
  round: 4
  context:
    - text: A frame's clause kind decides the form its predicate ends in — a clause marked te or stem, spliced into another by a
        link of the same kind, prints up to the te form or the masu stem of the predicate its registers build and hands the
        attention back with nothing after it, and the clause it is spliced into goes on; a bare -ing clause under while is the
        first construction the encoder reads that ends this way.
      pinned_by: test_clause_kind_decides_the_ending
    - text: The decoder reads its own output — the last morpheme printed stays in its state, a stem is printed with its conjugation
        class, and the finishing stage of the predicate takes the class from there and not from its position, so the two new modes
        added no position per class.
      pinned_by: test_decoder_reads_its_own_output
    - text: The rule generator prints a clause to a stem form as well (generate with a form), and on the sweep the printing rules
        print what it prints and refuse where it says the predicate has no such form.
      pinned_by: printer
    - text: The constructions generate() still builds by slicing — the purpose and manner clauses, an adjective's infinitive, the te
        link of coordination, the causative — take the form of the bare verb or of clause_pred, not of the whole predicate, so each
        needs a guard of its own on top of the two modes; and what follows a stem another frame printed — the tense after a
        causative stem — can be chosen from the output block once the attention is back, with no position per class.
      hypothesis: true
  acceptance: test_clause_kinds_end_at_stem_forms
  touches: [gen_module.py, parser_matrix.py, rules_ja.py, canon.py]

- id: coordination
  title: Coordinated clauses — one frame each, the first printed to its linking form
  status: open
  round: 4
  depends_on: [clause-modes]
  context:
    - text: A coordinated sentence folds the clause before the conjunction into a string — its te form for and, が for but, ので for
        so — that the rule parser carries as pre_clause, a register the frame has no slot for, so the encoder refuses every
        coordinated sentence the rules translate.
      pinned_by: matrix
    - text: The first clause ends at the conjunction, so the encoder flushes its frame there with a link of the conjunction's kind
        and reads the second clause into the cleared frame, keeping the subject when the second clause has none; the decoder
        prints the first frame to its linking form — te, or the finite form with が or ので — moves down, and prints the second.
      hypothesis: true
    - text: The te link is not the te form of the whole predicate — generate() takes clause_pred's, the verb with its progressive or
        the copula's adjective or noun, and falls back to the finite form with 、 when the clause is negative or a past adjective
        — so the te mode needs that guard, and the links with が and ので need no stem form at all.
      hypothesis: true
  stubs: [Coordination]
  acceptance: test_coordinated_clauses_agree
  touches: [parser_matrix.py, gen_module.py, parser_rules.py]

- id: subordinate-clauses
  title: Subordinate clauses — when, if, because, although — a frame each, printed first whichever came first
  status: done
  round: 4
  context:
    - text: The encoder reads a subordinate clause into a frame of its own in both orders — it opens on its conjunction, which the
        clause rules read, and the frame that closes first is flushed first — and the decoder prints the subordinate frame first
        either way, moving its attention up or down from the main clause's frame and back.
      pinned_by: test_subordinate_clause_in_both_orders
    - text: What a conjunction changes in its clause is written into the frame by the rule that flushes it, and every conjunction of
        the table has its ending after the clause's finite form; unless, which slices that form, is refused by the printing rules.
      pinned_by: test_subordinate_frame_holds_its_conjunction
    - text: unless prints once the ending of a negative can be chosen where the clause ends — it replaces the ない the finite form
        ends in; a conjunction that also reads as a preposition — before, after, since — and while after a main clause stay
        refused because the cell follows the rule parser's first reading of them, and reading them needs the reading that
        survives the fork.
      hypothesis: true
  acceptance: test_subordinate_clauses_agree_in_both_orders
  touches: [parser_matrix.py, gen_module.py, parser_rules.py, pp_module.py, rules_ja.py]

- id: relative-clauses
  title: Relative clauses — a frame printed before the noun phrase it modifies
  status: open
  round: 4
  depends_on: [clause-modes]
  context:
    - text: A relative clause is folded into the noun phrase it modifies as a string, the frame is marked folded, and the encoder
        refuses it.
      pinned_by: test_np_of_phrase
    - text: Japanese puts the clause before its head noun (医者である息子).  At the relative pronoun the encoder flushes the outer
        frame with a link on the role the clause modifies and reads the clause into the cleared frame; when the decoder reaches
        that role's noun phrase it moves down, prints the clause to its plain form, moves back up and prints the noun phrase.
        The outer frame is whole in the context, so nothing has to be held aside.
      hypothesis: true
    - text: A relative clause in the middle of its clause (the man who came is my uncle) leaves the outer clause unfinished when its
        frame is flushed; the remainder is read into a further frame, a continuation of the first, and the decoder's attention
        moves between the two.
      hypothesis: true
  stubs: [RelativeClause]
  acceptance: test_relative_clause_agrees
  touches: [parser_matrix.py, gen_module.py, np_module.py]

- id: infinitives
  title: Infinitive complements of a copula — te before the adjective, のは and のには before it
  status: open
  round: 4
  depends_on: [clause-modes]
  context:
    - text: The infinitive register holds an inner clause printed around the copula's adjective — the te form before it (difficult
        to solve → 解いて難しい), the clause with のは before an extraposed one (it is definite that S), a noun-phrase infinitive with
        のには — and the encoder refuses it.
      pinned_by: matrix
    - text: Each is a frame with a link of its own kind on the copula's frame — the decoder moves down before the adjective and
        the clause ends at te, or with のは or のには — and the dummy subject それ of an extraposed clause is dropped as the weather
        rule drops it.
      hypothesis: true
    - text: The te before the adjective is the bare verb's — generate() slices the whole finite predicate off and drops what the
        inner clause's flags added — so the te mode needs a guard that the inner frame holds nothing but the verb; のは and のには
        follow a finite form and need a frame and a link only.
      hypothesis: true
  stubs: [Infinitive]
  acceptance: test_infinitive_clauses_agree
  touches: [parser_matrix.py, gen_module.py, predicate_module.py]

- id: purpose-clauses
  title: Purpose clauses — the masu stem with に, or the plain form with ために, before the main verb
  status: open
  round: 4
  depends_on: [clause-modes]
  context:
    - text: A purpose infinitive after a verb (come to talk, go to see) is folded as purpose_clause and printed before the main verb
        as the masu stem with に, or the plain form with ために; the encoder refuses it.
      pinned_by: matrix
    - text: The main clause's frame is flushed with a purpose link when the infinitive opens; the decoder moves down before the main
        verb, and the clause ends at the masu stem with に, or at the plain form with ために.
      hypothesis: true
    - text: The masu stem with に is the bare verb's, with no progressive for a stative verb, so the stem mode needs a guard on the
        inner frame; ために follows a finite form and needs a frame and a link only.
      hypothesis: true
  stubs: [PurposeClause]
  acceptance: test_purpose_clauses_agree
  touches: [parser_matrix.py, gen_module.py, pp_module.py]

- id: gerunds
  title: Gerund and manner clauses — the plain form with のを or こと, the masu stem with ながら
  status: open
  round: 4
  depends_on: [clause-modes]
  context:
    - text: A gerund clause — the object of a preposition or a verb (thinking of going, insisted on going) — or a manner clause
        (stood looking) is folded into the frame as a string, and the encoder refuses it.
      pinned_by: matrix
    - text: The frame of the verb before the gerund is flushed with a link of the clause's kind; the decoder moves down where the
        object or the manner goes, and the clause ends at the plain form with のを or こと, or at the masu stem with ながら.
      hypothesis: true
    - text: Only the manner clause ends at a stem — the bare verb's, as the purpose clause's — and the gerund follows a finite form.
      hypothesis: true
  stubs: [Gerund]
  acceptance: test_gerund_clauses_agree
  touches: [parser_matrix.py, gen_module.py, pp_module.py]

- id: control-clauses
  title: Object-control clauses — the object as the inner subject, ように or the causative with the outer tense
  status: open
  round: 4
  depends_on: [clause-modes]
  context:
    - text: An object-control clause (asked him to open the window, made him change his plan) is folded as control — its subject
        takes に, its predicate the plain form with ように, or the causative conjugated with the outer clause's tense — and the
        encoder refuses it.
      pinned_by: matrix
    - text: The object becomes the inner clause's subject, the one slot block the boundary does not clear but moves.  The clause
        ends at the plain form with ように, or at the causative stem, whose finite suffix the decoder prints after the attention
        is back on the outer frame, from that frame's tense.
      hypothesis: true
  stubs: [ControlClause]
  acceptance: test_control_clauses_agree
  touches: [parser_matrix.py, gen_module.py, predicate_module.py]

# ---------------------------------------------------------------------------------------------------- round 5
# The gaps recorded after subordinate clauses and clause modes.  First what the cell refuses and the rules translate, with no
# inner clause to wait for; then what the decoder's own-output read left undone; then the rule transducer's own refusals, by
# where the parser stops; then the outputs nobody has judged.
- id: copula-idiom
  title: The adjective that takes a preposition (absent from, afraid of, good at) — a copula kind of its own
  status: open
  round: 5
  context:
    - text: An adjective with its preposition is a copula kind the frame has no slot for, so the printing rules refuse the clause
        and the cell refuses the sentence where the rules translate it.
      pinned_by: check_todo
    - text: It needs no inner clause, no stem form and no second reading — a row per pair of the adjective table in the copula
        module, which writes the predicate and the particle of its object, a copula kind in the frame, and one branch of the
        printing rules that prints the predicate as a stem of its class and leaves the ending to the finishing stage.
      hypothesis: true
  acceptance: test_copula_idiom_agrees
  touches: [predicate_module.py, parser_matrix.py, gen_module.py]

- id: copula-that-clause
  title: A that-clause after a copula (I am sure she will come) — the copula module's second exit
  status: open
  round: 5
  context:
    - text: A that-clause after a copula opens inside the copula module, which refuses it.
      pinned_by: test_context_is_one_frame_per_clause
    - text: The copula module returns at the clause as the PP machine returns at a conjunction, the clause rules open the frame,
        and the copula's predicate prints after the clause as a verb's does.
      hypothesis: true
  acceptance: test_copula_that_clause_agrees
  touches: [predicate_module.py, parser_matrix.py]

- id: fork-readings
  title: The second reading of a fork — before and since as conjunctions, and after a noun phrase
  status: open
  round: 5
  context:
    - text: After a main clause the PP machine reads a conjunction that is also a preposition as the preposition and while as a
        coordinator, the rule parser's first readings.
      pinned_by: test_subordinate_clause_in_both_orders
    - text: A sentence the rule parser translates by the second reading of a fork — before the rain started, my father and i — is
        refused by the cell.
      pinned_by: check_todo
    - text: The rule parser settles a fork by which reading dies first inside its window, and the cell's window is as wide — where
        the tokens that kill a reading are in the window at the fork, a rule can take the surviving reading there.
      hypothesis: true
  acceptance: test_second_reading_of_a_fork_agrees
  touches: [pp_module.py, np_module.py, parser_matrix.py]

- id: unless-clauses
  title: unless — the ending of a negative chosen where the clause ends
  status: open
  round: 5
  context:
    - text: The encoder reads an unless-clause into a frame with the negative written in, and the printing rules refuse it.
      pinned_by: test_subordinate_clause_in_both_orders
    - text: generate() replaces the ない the clause's finite form ends in by なければ and appends なら to any other ending, which the
        decoder cannot do once the morpheme is out; if the last morpheme of a negative is printed by one shared position, that
        position prints the conditional under unless, and the end of the clause reads from the output block whether it did.
      hypothesis: true
  acceptance: test_unless_clause_prints
  touches: [gen_module.py]

- id: subordinate-chains
  title: More than one frame beside a main clause — a second subordinate clause, a that-clause inside one, an adverb before one
  status: open
  round: 5
  context:
    - text: The encoder refuses a second subordinate clause, a that-clause inside a subordinate clause, and a subordinate clause
        that opens when its main clause has begun.
      pinned_by: test_subordinate_clause_in_both_orders
    - text: The decoder walks from a main clause to the one frame beside it; a mark on each frame for the neighbour to visit first
        would let the same moves reach a chain, and a front adverb read before a subordinate clause needs a register the boundary
        does not clear.
      hypothesis: true
  acceptance: test_subordinate_chains_agree
  touches: [parser_matrix.py, gen_module.py]

- id: fixed-templates
  title: Sentences printed from a template of their own — an exclamation, a thank-you, the hearsay tail
  status: open
  round: 5
  context:
    - text: An exclamation, a thank-you and the hearsay tail (… , i hear) are registers the frame has no slot for, and the cell
        refuses the sentences the rules translate with them.
      pinned_by: check_todo
    - text: Each is a constant frame around one noun phrase or one clause — a slot for the register and a branch of the printing
        rules that prints its template.
      hypothesis: true
  acceptance: test_fixed_templates_agree
  touches: [parser_matrix.py, gen_module.py, pp_module.py]

- id: composed-noun-phrases
  title: Two noun phrases in one role (both … and, not A but B) and the noun phrase of a question word
  status: open
  round: 5
  context:
    - text: A role whose string the rule parser composes of two noun phrases, and the noun phrase of a question word (how many
        pens), are written to no slot of the frame, and the cell refuses the sentence.
      pinned_by: check_todo
    - text: A second noun-phrase role beside the first, with the connective as a slot, and the question word's noun phrase as a
        role of its own, are run by the noun-phrase module as an of-phrase is.
      hypothesis: true
  acceptance: test_composed_noun_phrases_agree
  touches: [np_module.py, parser_matrix.py, gen_module.py]

- id: possessive-noun-phrases
  title: A possessive with 's before a noun (her uncle's house)
  status: open
  round: 5
  context:
    - text: The noun-phrase module refuses a possessive with 's before a noun, which the rule parser reads.
      pinned_by: check_todo
    - text: The possessor is a noun phrase run once more on slots of its own and printed before the head with の, as the of-phrase
        is.
      hypothesis: true
  acceptance: test_possessive_noun_phrases_agree
  touches: [np_module.py, parser_matrix.py, gen_module.py]

- id: sentence-end-by-hand
  title: The end of the sentence by hand — a question mark in a shape the traces have not seen
  status: open
  round: 5
  context:
    - text: The rule that consumes the end of the sentence is extracted from traces, one control point per path that reaches it.
      pinned_by: test_clause_modules_replace_extraction
    - text: Where the traces of a path all end in a full stop, a question mark is read as one, and the cell prints a statement
        where the rules print a question.
      pinned_by: check_todo
    - text: end() is a small machine — the end token, the question mark into the question flag or the sentence block, nothing after
        it — and translated by hand it decides every path alike; a tail that returns without consuming a token leaves no event in
        a trace, so where a clause ends is decided by an extracted row, guarded by hand only where a subordinate clause closes.
      hypothesis: true
  acceptance: test_question_mark_in_an_unseen_shape
  touches: [parser_matrix.py, predicate_module.py]

- id: predicate-stages-read-class
  title: The stages of the predicate before its ending read the stem's class from the output block too
  status: open
  round: 5
  context:
    - text: The finishing stage of the predicate takes the conjugation class from the output block, with one position per mode.
      pinned_by: test_decoder_reads_its_own_output
    - text: The stages before it — the copula's must, the complement, the modal, the request and the imperative — still have a
        position per class.
      pinned_by: check_todo
    - text: A plain verb and ある, whose stem is not out, keep positions of their own; every other class is read from the block, so
        each stage becomes one position for the stems that are out.
      hypothesis: true
  acceptance: test_predicate_stages_read_the_class
  touches: [gen_module.py]

- id: output-class-register
  title: The decoder keeps what its rules read of its output — the class — not a unit per morpheme
  status: open
  round: 5
  context:
    - text: The output block is kept by one keep unit per morpheme.
      pinned_by: test_decoder_reads_its_own_output
    - text: The printing rules read nothing of the block but the class of the last morpheme as a stem.
      pinned_by: test_print_rules_normal_form
    - text: A register of the classes, written by the rule that prints a stem and cleared by any other morpheme, carries the same
        information in a handful of units, and the block of morphemes need not be kept.
      hypothesis: true
  acceptance: test_decoder_keeps_only_the_class
  touches: [parser_matrix.py, gen_module.py]

- id: verb-preposition-idioms
  title: A verb with a preposition the idiom table has no row for (call for, make up for)
  status: open
  round: 5
  context:
    - text: The rule parser refuses a verb followed by a preposition it has no idiom row for, at the tail of the clause.
      pinned_by: check_todo
    - text: These are rows of the idiom table, not grammar — each pair with its Japanese verb and the particle of its object.
      hypothesis: true
  acceptance: test_verb_preposition_idioms_right
  touches: [tables/idioms.tbl, tables/lexicon.tbl]

- id: noun-phrase-adverbials
  title: A noun phrase after the object that is no argument — the best, all day long, called me a coward
  status: open
  round: 5
  context:
    - text: The rule parser refuses a noun phrase after the object that is an adverbial of degree or time, or an object complement.
      pinned_by: check_todo
    - text: The adverbials are a closed list for the adverb register; the complement is a second role of a few verbs, printed
        before the verb with と.
      hypothesis: true
  acceptance: test_noun_phrase_adverbials_right
  touches: [parser_rules.py, rules_ja.py, tables/lexicon.tbl]

- id: fronted-phrases
  title: A prepositional phrase or a participle clause before the subject
  status: open
  round: 5
  context:
    - text: The rule parser refuses a sentence that opens with a prepositional phrase or a participle clause (in the summer , …;
        looking into the room , …).
      pinned_by: check_todo
    - text: The prepositional phrase is the tail's, read first into the same roles; the participle clause is a subordinate clause
        without a conjunction, a frame of its own that ends at the te form.
      hypothesis: true
  acceptance: test_fronted_phrases_right
  touches: [parser_rules.py, rules_ja.py]

- id: nominal-adjectives
  title: The + adjective as a noun phrase (in the dark, the impossible)
  status: open
  round: 5
  context:
    - text: The rule parser refuses the with an adjective and no noun as a noun phrase.
      pinned_by: check_todo
    - text: It is one more shape of the noun phrase — the adjective as head, closed with もの or a noun the table gives.
      hypothesis: true
  acceptance: test_nominal_adjectives_right
  touches: [parser_rules.py, np_module.py, tables/lexicon.tbl]

- id: wh-clauses-after-predicate
  title: A clause a question word opens after the predicate — , where we stayed; what he said
  status: open
  round: 5
  context:
    - text: The rule parser refuses a relative clause with where after a comma and a free relative with what after the predicate.
      pinned_by: check_todo
    - text: Both are inner clauses of the kind the embedded question already parses after ask and know; here one attaches to a noun
        phrase and the other stands as the copula's noun.
      hypothesis: true
  acceptance: test_wh_clauses_after_predicate_right
  touches: [parser_rules.py, rules_ja.py]

- id: unjudged-outputs
  title: A verdict on every output the rule transducer gives
  status: done
  round: 5
  context:
    - text: A verdict is right, stiff or wrong — natural Japanese that says what the English says; grammatical and faithful but
        not how it is said; or neither — a stiff or wrong one names its cause, and a stiff output ranks above a wrong one and a
        refusal and below a right one.
      pinned_by: test_lattice_order
    - text: Every output of the rule transducer on the corpus is the reference or carries a verdict, so no sentence item is
        unjudged and the frontier groups the judged outputs by what their verdicts blame.
      pinned_by: check_todo
    - text: The verdicts were given by a model reading each output against its English, and their causes name the next rules to
        fix more reliably than they rank two outputs of the same sentence.
      hypothesis: true
  acceptance: test_every_output_is_judged
  touches: [harness/adjudications.json, harness/lattice.py, schemas/adjudications.schema.json]

# ---------------------------------------------------------------------------------------------------- round 6
# What the verdicts on every output blame.  One item per cause a verdict can name: its acceptance test reads the baseline and the
# verdicts and passes when no output is judged wrong (or, for the last two, stiff) for that cause, so an item closes by fixing the
# rule or the table row behind each output, or by refusing the sentence — a refusal ranks above a wrong output — and never by
# re-judging.  The standard of the verdicts: plain against polite is not judged unless the sentence's own words ask for one of
# them; the direction of a giving verb is judged like the person of a Latin verb; stiff is above wrong and refused, below right.
- id: idiom-readings
  title: Set phrases read as a whole or refused, never word for word
  status: open
  round: 6
  context:
    - text: Outputs in the baseline are judged wrong because a set phrase was read word for word — a verb with its particle (put on
        your shoes → 靴に置く, got out of the taxi → 外に得た), a light verb with its noun (shook hands → 手を振った, keeps company
        → 会社を保つ), a prepositional phrase (for the first time → 最初の時間のために, by chance → 機会で), a reflexive verb
        (applied himself to → 自分を当てはまった), a complement pattern (I wish I could, it took them two years to) or an opaque
        idiom (for the birds → 鳥のためにある).
      pinned_by: check_todo
    - text: The first four kinds are rows of the idiom and use tables — keyed on the verb with its particle or its noun, or on the
        whole phrase as a multiword token — and each row moves its sentences without a change to the parser; the complement
        patterns are rows of the complement table with a template each.
      hypothesis: true
    - text: An idiom no table lists cannot be recognised, but most of them hang on a light verb — get, take, make, have, put, come,
        go, keep — followed by a particle or a bare noun that no row covers, and refusing that shape instead of composing it
        moves those sentences from WRONG to REFUSED, which is up.
      hypothesis: true
  acceptance: test_no_idiom_read_word_for_word
  touches: [tables/idioms.tbl, tables/use.tbl, tables/complements.tbl, parser_rules.py]

- id: word-senses
  title: A word's sense chosen by the class of its argument
  status: open
  round: 6
  context:
    - text: Outputs in the baseline are judged wrong because a word was given a sense its argument rules out — have with a drink or
        a meal (持つ), see with a person (見る for 会う), tell with a question word (話す for 教える), ask with an infinitive (尋ねる
        for 頼む), stay at home (泊まる), old of a person (古い), well and hard as 上手に and 一生懸命, just as ちょうど, and a
        transitive verb where nothing is acted on (映画は始める, 状況は変えた).
      pinned_by: check_todo
    - text: The parser's state already decides which reading of a token is used (i rest → 休む, i need a rest → 休息).
      pinned_by: test_feedback_edges
    - text: A sense row keyed on the word and the class of its object, subject or modified noun — person, drink, meal, place, time
        — read where that argument closes, as the use-verb rewrite is, and a pairing of each transitive verb with its intransitive
        partner chosen by whether an object was read, cover these without a new register.
      hypothesis: true
  acceptance: test_no_sense_against_its_argument
  touches: [tables/lexicon.tbl, tables/verb_classes.tbl, parser_rules.py, rules_ja.py]

- id: preposition-readings
  title: A preposition read by the class of its noun
  status: open
  round: 6
  context:
    - text: Outputs in the baseline are judged wrong because a preposition was read apart from its noun — for with a duration as
        purpose (２日のために), by with a time as beside (月曜日のそばに) and with a vehicle the same (車のそばに), at, on and in
        with a time as で (正午で, 日曜日で, 朝で), above a place as the place of the act (橋の上で), with a cause as company
        (風邪と).
      pinned_by: check_todo
    - text: The preposition table keyed on the preposition and the class of its noun — duration, clock time, day, vehicle, person —
        gives 間, までに, で and に where they belong, and the classes are those the duration table and the lexicon already hold.
      hypothesis: true
  acceptance: test_no_preposition_against_its_noun
  touches: [tables/prepositions.tbl, tables/duration.tbl, pp_module.py, parser_rules.py]

- id: argument-particles
  title: The particle a verb asks of its argument
  status: open
  round: 6
  context:
    - text: Outputs in the baseline are judged wrong because an argument carries a particle its verb does not take — を with 乗る,
        会う, 反対する, 着く, なる, 電話する and 知らせる, which take に; を with 結婚する, which takes と; に or で with 出る of a
        place one leaves, which takes を; and は on 誰か.
      pinned_by: check_todo
    - text: The suite of particles by verb frame is closed, so the mechanism exists and each of these verbs is a row it lacks.
      pinned_by: suites
    - text: A wrong particle is an agreement failure, judged like a Latin case ending, and every verb whose row is missing is found
        by listing the verbs of the outputs this item's test names.
      hypothesis: true
  acceptance: test_no_particle_against_its_verb
  touches: [tables/verb_classes.tbl, rules_ja.py]

- id: giving-direction
  title: The giving verb chosen by who gives to whom
  status: open
  round: 6
  context:
    - text: Outputs in the baseline are judged wrong because a gift to the speaker is printed with あげる (please give me this book
        → 私にこの本をあげてください), which sends it away from the speaker.
      pinned_by: check_todo
    - text: The choice among あげる, くれる and もらう is agreement with the persons of the giver and the receiver — くれる and
        ください when the receiver is the speaker or the speaker's side, もらう when the receiver is the subject, あげる otherwise
        — a decision over the subject and indirect-object slots the frame already holds, and a wrong choice is judged like a Latin
        verb in the wrong person.
      hypothesis: true
    - text: Their honorific and humble partners — くださる, 差し上げる, いただく — are chosen by the situation, which is the head of
        item situation-head, not by the frame.
      hypothesis: true
  acceptance: test_no_giving_verb_against_its_persons
  touches: [rules_ja.py, gen_module.py, tables/verb_classes.tbl]

- id: predicate-forms
  title: No predicate form that is not Japanese
  status: open
  round: 6
  context:
    - text: Outputs in the baseline are judged wrong because a form was built that Japanese does not have — too before an adjective
        as a prefix (すぎ高い for 高すぎる), a する-verb conjugated as a godan verb (失敗すた, 欠席すった), 知っていない for 知らない,
        たい said of a third person and 欲しがる of the speaker, 同じな, a relative clause that ends in だ (好きだドレス), a だ after
        an i-adjective, and は before も.
      pinned_by: check_todo
    - text: The two する-verbs are rows of the lexicon with the wrong class, and the rest are one guard each in the predicate —
        すぎる after the stem the class of the adjective gives, the stative verbs that take no ている in the negative, たがる by
        the person of the subject — which the printing rules then mirror.
      hypothesis: true
  acceptance: test_no_form_that_is_not_japanese
  touches: [tables/lexicon.tbl, tables/adjectives.tbl, rules_ja.py, gen_module.py]

- id: modal-and-tense-readings
  title: Modals by their use, and the tense the English form fixes
  status: open
  round: 6
  context:
    - text: Outputs in the baseline are judged wrong because a modal or a tense was misread — may of permission as かもしれない,
        would like as a past wish (行きたかった), shall I as a plain question, a past form that looks like the present under a
        third-person subject (she put → 置く, he promised → 約束する), is going to be and is getting as a state (１４だ, よりきれいだ)
        and a lost may (you may be right → あなたは正しい).
      pinned_by: check_todo
    - text: May with a first-person subject in a question, or a second-person subject in a statement, is permission (てもいい);
        would like is たい in the present; shall I is ましょうか; and a verb whose base and past forms coincide is past under a
        third-person singular subject, because the present would carry -s — the agreement the rule parser already checks.
      hypothesis: true
  acceptance: test_no_modal_or_tense_misread
  touches: [tables/modals.tbl, parser_rules.py, rules_ja.py, predicate_module.py]

- id: clause-structure-readings
  title: Constructions read as what they are
  status: open
  round: 6
  context:
    - text: Outputs in the baseline are judged wrong because a construction was read as another — a copula with an infinitive as an
        arrangement (my hobby is to read → 読むことになっている), a relative clause on a time noun as a time clause (the day when),
        a free relative as an indirect question (what you told me → 何を話したか), how far and how is with the question word
        lost, an infinitive after a verb of asking or promising as a purpose (ために), as of manner as because, and an adverb or
        a time phrase attached to the wrong head (nearly every day, a child today).
      pinned_by: check_todo
    - text: Each is a fork the rule parser resolves to its first reading; the copula with an infinitive and the lost question word
        are single rules, and the others need the reading chosen by the head just read — a time noun before when, a verb of
        saying before what — within the window the parser already has.
      hypothesis: true
  acceptance: test_no_construction_misread
  touches: [parser_rules.py, rules_ja.py, predicate_module.py, tables/wh.tbl]

- id: counters-and-quantifiers
  title: Counts with their counter, and few and little as scarcity
  status: open
  round: 6
  context:
    - text: Outputs in the baseline are judged wrong because a count lacks its counter or its amount (２娘, ３切符, 時間を眠った,
        people counted with いくつ) or because few, little and none are printed as some (少しの人々, 小さい水, 電話の何も).
      pinned_by: check_todo
    - text: A counter is a column of the lexicon's noun rows — 人, 枚, 本, 時間 — read by the number slot of the noun phrase, and
        few and little are ほとんど with a negative predicate, a quantifier that writes the negation the way never does.
      hypothesis: true
  acceptance: test_no_count_without_its_counter
  touches: [tables/lexicon.tbl, tables/numbers.tbl, tables/determiners.tbl, np_module.py, rules_ja.py]

- id: dummy-it
  title: No それ for an it that points at nothing
  status: open
  round: 6
  context:
    - text: Outputs in the baseline are judged wrong because the it of weather, of dates and of extraposition is printed as それは
        (it 's hot today → 今日それは暑い, it is a good idea to read this book → それは…読むのには良い考えだ).
      pinned_by: check_todo
    - text: It is a dummy when its predicate is a weather or calendar word or when an infinitive or a that-clause follows the
        predicate, both visible when the subject is printed, so the subject is dropped and the infinitive takes のは.
      hypothesis: true
  acceptance: test_no_dummy_it_printed
  touches: [parser_rules.py, rules_ja.py, gen_module.py]

- id: dropped-words
  title: A word the frame cannot hold is refused, not dropped
  status: open
  round: 6
  context:
    - text: Outputs in the baseline are judged wrong because a content word of the English is missing from them — looks (he looks
        tired → 彼は疲れている), wanted to (he wanted to be rich → 彼は金持ちだ), tall (how tall are you → あなたはどのくらいですか),
        going to do, playing, last night.
      pinned_by: check_todo
    - text: Each is a reading rule that consumes a token and writes no slot, or writes a slot the generator does not read for that
        predicate; the trace of each sentence names the rule, and where the frame has no slot for the word the rule refuses.
      hypothesis: true
  acceptance: test_no_word_dropped
  touches: [parser_rules.py, rules_ja.py, predicate_module.py]

- id: partial-negation
  title: Negation kept, and kept partial where the English is
  status: open
  round: 6
  context:
    - text: Outputs in the baseline are judged wrong because a negation was lost (she didn 't need to come → 来る必要がある, he had no
        hat on → 帽子を着ている) or widened from partial to total (not always → いつも…ない, not quite → かなり…ない).
      pinned_by: check_todo
    - text: Not before always, quite, all and every is partial negation, printed with わけではない after the affirmative clause, and
        the two lost negations are slots the need and have-on predicates do not read.
      hypothesis: true
  acceptance: test_no_negation_lost_or_widened
  touches: [parser_rules.py, rules_ja.py, gen_module.py]

- id: natural-pronouns
  title: A pronoun said once, and 自分 for the subject itself
  status: open
  round: 6
  context:
    - text: Outputs in the baseline are judged stiff because a pronoun the English repeats is repeated — 彼は彼の, 私が…私は across
        a subordinate clause, あなたの in a request — or because 彼女が inside a clause reads as someone other than the subject.
      pinned_by: check_todo
    - text: A possessive or an inner subject that equals the subject of its clause's main frame is dropped, or printed as 自分 where
        dropping it would change the reading; the comparison is between two slots the context already holds, one per frame.
      hypothesis: true
  acceptance: test_pronouns_said_once
  touches: [rules_ja.py, gen_module.py, parser_matrix.py]

- id: natural-wording
  title: Outputs said the way Japanese says them
  status: open
  round: 6
  depends_on: [word-senses, preposition-readings, counters-and-quantifiers]
  context:
    - text: Outputs in the baseline are judged stiff — grammatical and faithful but worded as the English is — most often 持っている
        for a relative, news or an obligation one has (いる, ある), a collocation carried over (パーティーを持つ, 枝を壊す, 目を閉める),
        a comparison or a quantity in the English order, をも for も, and the milder cases of the causes the other items of this
        round name.
      pinned_by: check_todo
    - text: Stiffness has no single mechanism — each group is the weak form of a cause above, and the rows and guards that close
        those items move most of these outputs with them.
      hypothesis: true
  acceptance: test_no_output_stiff
  touches: [tables/lexicon.tbl, tables/verb_classes.tbl, rules_ja.py]

- id: situation-head
  title: The situation as an input head — plain or polite chosen by the caller, every output labelled for it
  status: deferred
  round: 6
  context:
    - text: The rule generator chooses the register itself — polite for a question, plain otherwise — and the verdicts do not judge
        that choice, because no sentence of the corpus holds a word that asks for the other form.
      hypothesis: true
    - text: The register is not in the English, so it is an input — a situation block beside the sentence block, set by the caller
        and never written by the encoder, with at least the values plain and polite; the decoder's politeness predicate reads it in
        place of the question mark, and no other rule changes.
      hypothesis: true
    - text: Every judged output is then labelled with the value of the head it was printed for, a verdict is about a sentence, a
        situation and an output, and the corpus gives one item per sentence and value of the head.
      hypothesis: true
    - text: A sentence whose own words ask for one value — a vocative such as sir, an honorific title — and a head that says the
        other disagree like a subject and its verb, and the pair is refused, as the rule parser refuses a verb that disagrees with
        its subject.
      hypothesis: true
    - text: Further values of the same head — humble and honorific — choose くださる, 差し上げる and いただく over くれる, あげる and
        もらう, whose direction the frame decides.
      hypothesis: true
  stubs: [SituationHead]
  acceptance: test_situation_is_an_input
  touches: [rules_ja.py, gen_module.py, parser_matrix.py, harness/adjudications.json, schemas/adjudications.schema.json, harness/lattice.py]
  notes: Proposed for a later round and not in scope now; recorded so that the verdicts of round 5 are read with it in mind.

- id: verdict-audit
  title: A person's verdict in every group of judged outputs
  status: open
  round: 6
  context:
    - text: No group of judged outputs — a level, and for a stiff or wrong output its cause — holds a verdict that records a person
        as its judge.
      pinned_by: check_todo
    - text: A verdict is permanent and is about one output of one sentence, so an audit adds a person's verdict beside the model's
        or corrects the cause, and a sample from every group shows where the model's reading of naturalness can be trusted.
      hypothesis: true
  acceptance: test_model_verdicts_audited
  touches: [harness/adjudications.json]

