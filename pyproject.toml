[project]
name = "rnntranslator"
version = "0.1.0"
description = "An English-to-Japanese translator written as a rule circuit and compiled into sparse matrices"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.13.*"
dependencies = [
    "jsonschema>=4.23,<5",
    "numpy>=2.2,<3",
    "pyyaml>=6.0,<7",
    "scipy>=1.15,<2",
]

[dependency-groups]
# the cell under PyTorch (cell_torch.py, the `torch` action): CPU wheels only, from the PyTorch index below
torch = [
    "torch>=2.9,<3",
]

[tool.uv]
# Every dependency is resolved into uv.lock with its sha256; `uv sync --locked` refuses to run on a stale lock.
required-version = ">=0.9"
default-groups = ["torch"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
